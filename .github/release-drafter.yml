name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
no-changes-template: '- No changes'
template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG

categories:
  # Leave out changes that don't matter to users (CI, release tooling).
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  # Changelog sections: a PR is listed only in the first one it matches.
  - title: 'Features'
    exclusive: true
    when:
      label: 'feature'
  - title: 'Bug fixes'
    exclusive: true
    when:
      labels: ['fix', 'bug']
  - title: 'Maintenance'
    exclusive: true
    when:
      labels: ['maintenance', 'refactor', 'test', 'dependencies']
  - title: 'Documentation'
    when:
      label: 'documentation'

  # Version bump from the major/minor/patch labels, patch by default.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
